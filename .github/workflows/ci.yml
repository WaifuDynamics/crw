name: Verify CRW+
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:release -w @crw/mobile
      - run: npm run build
      - run: npm audit --audit-level=moderate
      - uses: actions/upload-artifact@v4
        with:
          name: crw-web-preview
          path: apps/mobile/dist
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: crw_test
          POSTGRES_USER: crw
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crw -d crw_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://crw:ci-only-password@localhost:5432/crw_test

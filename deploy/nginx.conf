# Web app for https://sport.konekocode.pl. Mirrors apps/mobile/vercel.json.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  # The rep counter frame on /pushups and /squats needs the camera.
  add_header Permissions-Policy "camera=(self)" always;

  location /_expo/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  # PWA: the service worker and manifest must never be cached, or updates stall.
  location = /sw.js {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    types { application/manifest+json webmanifest; }
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  absolute_redirect off;

  # Client-side routes such as /play, /pushups, /squats fall back to the app.
  location / {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri $uri.html $uri/ /index.html;
  }
}
